env = NIXOS_OZONE_WL, 1
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = GDK_BACKEND, wayland, x11
env = CLUTTER_BACKEND, wayland
env = QT_QPA_PLATFORM=wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = SDL_VIDEODRIVER, x11
env = MOZ_ENABLE_WAYLAND, 1

monitor = eDP-1,2560x1600@60.0,4290x1685,1.6
monitor = DVI-I-1,1920x1200@59.95,2410x105,1.0
monitor = DVI-I-1,transform,1
monitor = DVI-I-2,2560x1440@59.95,3610x245,1.0
monitor = ,preferred,auto,1
#
workspace = 1,monitor:DVI-I-2,default:true,persistent:true
workspace = 2,monitor:DVI-I-1,default:true,persistent:true
workspace = 3,monitor:DVI-I-1,persistent:true
workspace = 4,monitor:eDP-1,default:true,persistent:true
workspace = 5,persistent:true
workspace = 6,persistent:true
workspace = 7,persistent:true
workspace = 8,persistent:true
workspace = 9,persistent:true

general {
  gaps_in = 0
  gaps_out = 0
  border_size = 0
  layout = dwindle
  resize_on_border = true
  col.active_border = rgb(BF616A) rgb(88C0D0) 45deg
  col.inactive_border = rgb(3B4252)
}

input {
  kb_layout = us
  kb_variant = alt-intl
  kb_options = caps:escape
  repeat_rate = 35
  repeat_delay = 200
  follow_mouse = 1
  touchpad {
    natural_scroll = true
    disable_while_typing = true
    scroll_factor = 0.8
  }
  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
  accel_profile = flat
}

cursor {
  inactive_timeout = 30
  no_hardware_cursors = true
}

windowrule = border_size 0 ,match:class ^(wofi)$
windowrule = center on:class ^(wofi)$
windowrule = center on,match:class ^(steam)$
windowrule = match:class nm-connection-editor,float on
windowrule = match:class ^(org.pulseaudio.pavucontrol|.blueman-manager-wrapped)$,float on,size 50% 70%,
windowrule = match:class nwg-look|qt5ct|mpv,float on
windowrule = stay_focused on, match:title ^()$,match:class ^(steam)$
windowrule = min_size 1 1, match:title ^()$,match:class ^(steam)$
windowrule = workspace 1, match:class ^(Alacritty)$
windowrule = opacity 1.0 0.9, workspace 2, match:class ^(firefox)$
windowrule = opacity 1.0 0.9, workspace 3, match:class ^(brave-browser)$
windowrule = opacity 0.9 0.7, match:class ^(thunar)$
gesture = 3, horizontal, workspace

misc {
  initial_workspace_tracking = 0
  mouse_move_enables_dpms = true
  key_press_enables_dpms = false
}

animations {
  enabled = yes
  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1
  animation = windows, 1, 6, wind, slide
  animation = windowsIn, 1, 6, winIn, slide
  animation = windowsOut, 1, 5, winOut, slide
  animation = windowsMove, 1, 5, wind, slide
  animation = border, 1, 1, liner
  animation = fade, 1, 10, default
  animation = workspaces, 1, 5, wind
}

decoration {
  rounding = 0
  rounding_power = 0
  blur {
      enabled = true
      size = 5
      passes = 3
      new_optimizations = on
      ignore_opacity = off
  }
}

plugin {
  hyprtrails {
  }
}

dwindle {
  pseudotile = true
  preserve_split = true
}
$modifier = SUPER

bind = $modifier,0,workspace,10
bind = $modifier,1,workspace,1
bind = $modifier,2,workspace,2
bind = $modifier,3,workspace,3
bind = $modifier,4,workspace,4
bind = $modifier,5,workspace,5
bind = $modifier,6,workspace,6
bind = $modifier,7,workspace,7
bind = $modifier,8,workspace,8
bind = $modifier,9,workspace,9
bind = $modifier,B,exec,rofi-bookmarks
bind = $modifier,C,exec,hyprpicker -a
bind = $modifier,E,exec,thunar
bind = $modifier,F,exec,rofi-web-search
bind = $modifier,H,movefocus,l
bind = $modifier,J,movefocus,d
bind = $modifier,K,movefocus,u
bind = $modifier,L,movefocus,r
bind = $modifier,P,exec,rofi-project-picker
bind = $modifier,Q,killactive,
bind = $modifier,R,exec,rofi-launcher
bind = $modifier,S,exec,rofi-ssh-picker
bind = $modifier,T,exec,rofi-tmux-picker
bind = $modifier,V,exec,rofi-clipboard-history
bind = $modifier,RETURN,exec,alacritty
bind = $modifier,SPACE,togglespecialworkspace
bind = $modifier,;,exec,emoji-picker
bind = $modifier,mouse_down,workspace, e+1
bind = $modifier,mouse_up,workspace, e-1
bind = $modifier CONTROL,L,exec,hyprlock
bind = $modifier CONTROL,left,workspace,e-1
bind = $modifier CONTROL,right,workspace,e+1
bind = $modifier SHIFT,0,movetoworkspace,10
bind = $modifier SHIFT,1,movetoworkspace,1
bind = $modifier SHIFT,2,movetoworkspace,2
bind = $modifier SHIFT,3,movetoworkspace,3
bind = $modifier SHIFT,4,movetoworkspace,4
bind = $modifier SHIFT,5,movetoworkspace,5
bind = $modifier SHIFT,6,movetoworkspace,6
bind = $modifier SHIFT,7,movetoworkspace,7
bind = $modifier SHIFT,8,movetoworkspace,8
bind = $modifier SHIFT,9,movetoworkspace,9
bind = $modifier SHIFT,B,exec,list-hypr-bindings
bind = $modifier SHIFT,C,exit,
bind = $modifier SHIFT,F,fullscreen,
bind = $modifier SHIFT,I,togglesplit,
bind = $modifier SHIFT,N,exec,swaync-client -rs
bind = $modifier SHIFT,T,togglefloating,
bind = $modifier SHIFT,S,exec,screen-capture
bind = $modifier SHIFT,SPACE,movetoworkspace,special
bind = $modifier SHIFT,H,movewindow,l
bind = $modifier SHIFT,J,movewindow,d
bind = $modifier SHIFT,K,movewindow,u
bind = $modifier SHIFT,L,movewindow,r
bindm = $modifier,mouse:272,movewindow
bindm = $modifier,mouse:273,resizewindow
bind = ALT,Tab,cyclenext
bind = ALT,Tab,bringactivetotop
bind = ,XF86AudioRaiseVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = ,XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86AudioPlay, exec, playerctl play-pause
bind = ,XF86AudioPause, exec, playerctl play-pause
bind = ,XF86AudioNext, exec, playerctl next
bind = ,XF86AudioPrev, exec, playerctl previous
bind = ,XF86MonBrightnessDown,exec,brightnessctl set 5%-;brightnessctl --device kbd_backlight set 5%-
bind = ,XF86MonBrightnessUp,exec,brightnessctl set +5%;brightnessctl --device kbd_backlight set 5%+
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 2560x1600@60.0, auto, 1.25"
bindl = , switch:on:Apple SMC power/lid events, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Apple SMC power/lid events, exec, hyprctl keyword monitor "eDP-1, 2560x1600@60.0, auto, 1.25"
